{# 직원 얼굴(B2): 사진이 있으면 사진, 없으면 이름 첫 글자. 사진 주소는 사번으로. #}
{% macro avatar(u, size=64, cls='') -%}
{%- set nm = u['preferred_name'] or u['name'] or '?' -%}
{%- if u['photo'] and u['emp_no'] -%}
<img class="tc-avatar {{ cls }}" src="{{ url_for('person_photo', emp_no=u['emp_no'], v=u['photo'][-16:]) }}"
     alt="{{ u['name'] }} 사진" width="{{ size }}" height="{{ size }}"
     style="width:{{ size }}px;height:{{ size }}px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--surface-3, #eee);">
{%- else -%}
<div class="tc-avatar {{ cls }}" aria-hidden="true"
     style="width:{{ size }}px;height:{{ size }}px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--surface, #fff);font-weight:800;font-size:{{ (size * 0.4)|int }}px;">{{ (u['name'] or '?')[0] }}</div>
{%- endif -%}
{%- endmacro %}
